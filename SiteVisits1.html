<!-- SiteVisit.html -->
<div class="view-container">
  <!-- Tab Headers with Live Metric Badges -->
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); margin-bottom: 1.25rem; padding-bottom: 0.5rem; flex-wrap: wrap; gap: 0.75rem;">
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <button class="btn btn-secondary active-tab" id="tab-btn-logs" onclick="switchVisitSubTab('logs')" style="border: none; background: transparent; padding: 0.5rem 0.85rem; font-weight: 700; color: var(--primary); cursor: pointer; border-bottom: 3px solid var(--primary); border-radius: 0; display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-clipboard-list"></i> Visit Log History <span class="badge" id="badge-count-logs" style="background: rgba(15, 118, 110, 0.15); color: var(--primary); font-size: 0.75rem; border-radius: 20px; padding: 2px 8px;">0</span>
      </button>
      <button class="btn btn-secondary" id="tab-btn-scheduled" onclick="switchVisitSubTab('scheduled')" style="border: none; background: transparent; padding: 0.5rem 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 0; display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="far fa-calendar-check"></i> Scheduled Visits <span class="badge" id="badge-count-scheduled" style="background: rgba(100, 116, 139, 0.15); color: var(--text-muted); font-size: 0.75rem; border-radius: 20px; padding: 2px 8px;">0</span>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <span id="visit-filtered-count" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Showing all visits</span>
      <button class="btn btn-secondary btn-sm" id="btn-clear-visit-filters" onclick="clearVisitFilters()" style="display: none; padding: 0.35rem 0.65rem; font-size: 0.75rem; color: var(--danger);"><i class="fas fa-times-circle"></i> Clear Filters</button>
    </div>
  </div>

  <!-- Multi-Faceted Search & Filter Panel -->
  <div class="card" style="margin-bottom: 1.25rem; padding: 1rem 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: visible !important; position: relative; z-index: 50;">
    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <!-- Row 1: Omni-Search & Main Action Buttons -->
      <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
        <div class="search-input-wrapper" style="flex: 1; min-width: 280px;">
          <i class="fas fa-search"></i>
          <input type="text" id="visit-search" class="search-input" placeholder="Omni-Search by Purpose, Remarks, Project, Lead, Assignee, Visit ID..." oninput="filterVisits()" style="width: 100%;">
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button class="btn btn-secondary" onclick="refreshCurrentView()" title="Force Refresh View"><i class="fas fa-sync-alt"></i> Refresh</button>
          <button class="btn btn-primary" id="btn-add-visit" onclick="openVisitModal()"><i class="fas fa-plus"></i> Log Site Visit</button>
        </div>
      </div>

      <!-- Row 2: Searchable Filters & Date Range Pickers -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.75rem; align-items: center;">
        <!-- Searchable Project / Lead Dropdown -->
        <div>
          <select id="filter-visit-project" class="searchable-select" data-placeholder="All Projects & Leads" onchange="filterVisits()">
            <option value="">All Projects & Leads</option>
          </select>
        </div>

        <!-- Searchable Assignee Filter -->
        <div>
          <select id="filter-visit-assignee" class="searchable-select" data-placeholder="All Assignees / Staff" onchange="filterVisits()">
            <option value="">All Assignees / Staff</option>
          </select>
        </div>

        <!-- Billable Filter -->
        <div>
          <select id="filter-visit-billing" class="form-control" onchange="filterVisits()" style="padding: 0.45rem 0.75rem; font-size: 0.85rem; height: 38px;">
            <option value="">All Billing Status</option>
            <option value="Billable">Billable Visits Only (₹)</option>
            <option value="Non-Billable">Non-Billable Visits</option>
          </select>
        </div>

        <!-- Date Range Filter -->
        <div style="display: flex; gap: 0.4rem; align-items: center;">
          <input type="date" id="filter-visit-date-from" class="form-control" title="Visit Date From" onchange="filterVisits()" style="padding: 0.4rem 0.5rem; font-size: 0.8rem; height: 38px;" placeholder="From Date">
          <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">to</span>
          <input type="date" id="filter-visit-date-to" class="form-control" title="Visit Date To" onchange="filterVisits()" style="padding: 0.4rem 0.5rem; font-size: 0.8rem; height: 38px;" placeholder="To Date">
        </div>
      </div>
    </div>
  </div>

  <!-- Site Visit Table Card -->
  <div class="card">
    <div class="card-body" style="padding: 0;">
      <div class="table-wrapper" style="border: none;">
        <table class="data-table" id="visits-table">
          <thead>
            <tr>
              <th>Visit ID</th>
              <th>Project / Lead</th>
              <th>Visit Date</th>
              <th>Purpose</th>
              <th>Assignee</th>
              <th>Billable Amount</th>
              <th>Remarks</th>
              <th>Photos</th>
              <th>Status</th>
              <th style="text-align: right; width: 100px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="10" style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading site visits...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Site Visit Modal -->
<div class="modal-overlay" id="visit-modal">
  <div class="modal-container" style="max-width: 600px;">
    <div class="modal-header">
      <h3 class="modal-title" id="visit-modal-title">Log New Site Visit</h3>
      <button class="icon-btn" onclick="closeVisitModal()"><i class="fas fa-times"></i></button>
    </div>
    <form id="visit-form" onsubmit="handleVisitSubmit(event)">
      <input type="hidden" id="visit-id" name="VisitID">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group form-grid-full">
            <label class="form-label">Link Visit To *</label>
            <div style="display: flex; gap: 1.5rem; margin-top: 0.25rem; align-items: center;">
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-main);">
                <input type="radio" id="visit-link-project" name="LinkType" value="Project" checked onchange="handleVisitLinkTypeChange()" style="width: auto; cursor: pointer;">
                <i class="fas fa-building" style="color: var(--primary);"></i> Existing Project
              </label>
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-main);">
                <input type="radio" id="visit-link-lead" name="LinkType" value="Lead" onchange="handleVisitLinkTypeChange()" style="width: auto; cursor: pointer;">
                <i class="fas fa-bullseye" style="color: #0284c7;"></i> Lead / Prospect
              </label>
            </div>
          </div>

          <div class="form-group form-grid-full" id="visit-project-group">
            <label class="form-label">Select Project *</label>
            <select id="visit-project-id" name="ProjectID" class="form-control" required>
              <option value="">Select Project</option>
            </select>
          </div>

          <div class="form-group form-grid-full" id="visit-lead-group" style="display: none;">
            <label class="form-label">Select Lead / Prospect *</label>
            <select id="visit-lead-id" name="LeadID" class="form-control">
              <option value="">Select Lead</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Visit Date *</label>
            <input type="date" id="visit-date" name="VisitDate" class="form-control" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Next Followup Date</label>
            <input type="date" id="visit-followup-date" name="NextFollowupDate" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Assign Type *</label>
            <select id="visit-assigned-type" name="AssignedType" class="form-control" onchange="handleVisitAssignedTypeChange()" required>
              <option value="Staff">Internal Staff</option>
              <option value="Vendor">Vendor</option>
              <option value="Associate">Associate</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Assign To *</label>
            <select id="visit-assigned-to" name="AssignedTo" class="form-control" required>
              <option value="">Select Assignee</option>
            </select>
          </div>

          <!-- Billable Checkbox and Amount -->
          <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            <input type="checkbox" id="visit-is-billable" name="IsBillable" value="Yes" onchange="toggleVisitBillingField()" style="width: auto; margin: 0;">
            <label class="form-label" style="margin: 0; cursor: pointer;" for="visit-is-billable">Billable Site Visit</label>
          </div>

          <div class="form-group" id="visit-billing-group" style="display: none;">
            <label class="form-label">Billing Amount (₹) *</label>
            <input type="number" id="visit-billing-amount" name="BillingAmount" class="form-control" placeholder="e.g. 2000" min="0" step="0.01">
          </div>

          <div class="form-group">
            <label class="form-label">Status *</label>
            <select id="visit-status" name="Status" class="form-control" required>
              <option value="Completed">Completed</option>
              <option value="Scheduled">Scheduled</option>
            </select>
          </div>
          
          <div class="form-group form-grid-full">
            <label class="form-label">Purpose of Visit *</label>
            <input type="text" id="visit-purpose" name="Purpose" class="form-control" placeholder="e.g. Site measurement, client walk-through, slab casting inspection" required>
          </div>

          <div class="form-group form-grid-full">
            <label class="form-label">Remarks / Work Progress Status</label>
            <textarea id="visit-remarks" name="Remarks" class="form-control" placeholder="Describe current site layout details, issues resolved..."></textarea>
          </div>
          
          <input type="hidden" id="visit-photos-hidden" name="Photos">
          <div class="form-group form-grid-full">
            <label class="form-label">Add Attachment / Photos</label>
            <input type="file" id="visit-attachment" class="form-control" accept="image/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple>
            <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem;">Choose one or more files to upload directly to Google Drive. Leave empty to keep existing attachments if editing.</small>
            <div id="visit-current-attachments-container" style="margin-top: 0.5rem; display: none;">
              <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-main);">Current Attachments:</span>
              <div id="visit-current-attachments-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.25rem;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeVisitModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Log</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  var allVisits = [];
  var projectsCache = [];
  var leadsCacheList = [];
  var activeVisitTab = "logs";
  var staffCacheList = [];
  var vendorsCacheList = [];
  var associatesCacheList = [];

  window.handleVisitLinkTypeChange = function() {
    var isLead = document.getElementById("visit-link-lead") ? document.getElementById("visit-link-lead").checked : false;
    var projGroup = document.getElementById("visit-project-group");
    var leadGroup = document.getElementById("visit-lead-group");
    var projSelect = document.getElementById("visit-project-id");
    var leadSelect = document.getElementById("visit-lead-id");

    var currentLeads = (window.leadsCacheList || leadsCacheList || (window._dataCache && window._dataCache.leads) || []);
    if (leadSelect && currentLeads.length > 0) {
      var currentLeadVal = leadSelect.value;
      leadSelect.innerHTML = '<option value="">Select Lead</option>' + currentLeads.filter(function(l) {
        return l && (l.Status || l.LeadStatus || "") !== "Lost";
      }).map(function(l) {
        var name = l.CustomerName || l.LeadName || l.LeadID;
        return '<option value="' + escapeHtml(l.LeadID) + '">' + escapeHtml(name) + ' (' + escapeHtml(l.LeadID) + ')</option>';
      }).join("");
      if (currentLeadVal) leadSelect.value = currentLeadVal;
      if (window.makeSearchableSelect) window.makeSearchableSelect(leadSelect, { placeholder: "Select Lead" });
    }

    var currentProjects = (window.projectsCacheList || projectsCache || (window._dataCache && window._dataCache.projects) || []);
    if (projSelect && currentProjects.length > 0) {
      var currentProjVal = projSelect.value;
      projSelect.innerHTML = '<option value="">Select Project</option>' + currentProjects.filter(function(p) {
        return p && p.Status !== "Completed" && p.Status !== "Cancelled";
      }).map(function(p) {
        return '<option value="' + escapeHtml(p.ProjectID) + '">' + escapeHtml(p.ProjectName) + ' (' + escapeHtml(p.ProjectID) + ')</option>';
      }).join("");
      if (currentProjVal) projSelect.value = currentProjVal;
      if (window.makeSearchableSelect) window.makeSearchableSelect(projSelect, { placeholder: "Select Project" });
    }

    if (isLead) {
      if (projGroup) projGroup.style.display = "none";
      if (leadGroup) leadGroup.style.display = "block";
      if (projSelect) { projSelect.removeAttribute("required"); }
      if (leadSelect) { leadSelect.setAttribute("required", "required"); }
    } else {
      if (projGroup) projGroup.style.display = "block";
      if (leadGroup) leadGroup.style.display = "none";
      if (leadSelect) { leadSelect.removeAttribute("required"); }
      if (projSelect) { projSelect.setAttribute("required", "required"); }
    }
  };

  window.switchVisitSubTab = function(subTab) {
    activeVisitTab = subTab;
    var logsBtn = document.getElementById("tab-btn-logs");
    var scheduledBtn = document.getElementById("tab-btn-scheduled");
    var addBtn = document.getElementById("btn-add-visit");
    if (!logsBtn || !scheduledBtn)
      return;
    if (subTab === "logs") {
      logsBtn.style.color = "var(--primary)";
      logsBtn.style.borderBottom = "3px solid var(--primary)";
      logsBtn.style.fontWeight = "700";
      scheduledBtn.style.color = "var(--text-muted)";
      scheduledBtn.style.borderBottom = "none";
      scheduledBtn.style.fontWeight = "600";
      if (addBtn)
        addBtn.innerHTML = '<i class="fas fa-plus"></i> Log Site Visit';
    } else {
      scheduledBtn.style.color = "var(--primary)";
      scheduledBtn.style.borderBottom = "3px solid var(--primary)";
      scheduledBtn.style.fontWeight = "700";
      logsBtn.style.color = "var(--text-muted)";
      logsBtn.style.borderBottom = "none";
      logsBtn.style.fontWeight = "600";
      if (addBtn)
        addBtn.innerHTML = '<i class="fas fa-plus"></i> Schedule Site Visit';
    }
    filterVisits();
  };

  window.loadSiteVisitsView = function(forceRefresh) {
    var currentUser = JSON.parse(localStorage.getItem("pm_user") || "{}");
    var isSuperAdmin = currentUser.roleId === "Super Admin";
    var perms = currentUser.permissions || {};
    var visitPerm = perms["SiteVisits"] || {};
    var canAdd = isSuperAdmin || visitPerm.add === true;
    var addBtn = document.getElementById("btn-add-visit");
    if (addBtn) addBtn.style.display = canAdd ? "inline-block" : "none";

    function applySiteVisitsData(result) {
      if (!result) return;
      customersCacheList = (Array.isArray(result.customers) && result.customers.length > 0) ? result.customers : ((window._dataCache && window._dataCache.customers) || []);
      window.customersCacheList = customersCacheList;

      projectsCache = (Array.isArray(result.projects) && result.projects.length > 0) ? result.projects : ((window._dataCache && window._dataCache.projects) || []);
      window.projectsCache = projectsCache;
      var select = document.getElementById("visit-project-id");
      if (select) {
        select.innerHTML = '<option value="">Select Project</option>' + projectsCache.filter(function(p) {
          return p && p.Status !== "Completed" && p.Status !== "Cancelled";
        }).map(function(p) {
          return '<option value="' + escapeHtml(p.ProjectID) + '">' + escapeHtml(p.ProjectName) + ' (' + escapeHtml(p.ProjectID) + ')</option>';
        }).join("");
      }

      leadsCacheList = (Array.isArray(result.leads) && result.leads.length > 0) ? result.leads : ((window._dataCache && window._dataCache.leads) || []);
      window.leadsCacheList = leadsCacheList;
      var leadSelect = document.getElementById("visit-lead-id");
      if (leadSelect) {
        leadSelect.innerHTML = '<option value="">Select Lead</option>' + leadsCacheList.filter(function(l) {
          return l && (l.Status || l.LeadStatus || "") !== "Lost";
        }).map(function(l) {
          var name = l.CustomerName || l.LeadName || l.LeadID;
          return '<option value="' + escapeHtml(l.LeadID) + '">' + escapeHtml(name) + ' (' + escapeHtml(l.LeadID) + ')</option>';
        }).join("");
      }

      allVisits = Array.isArray(result.siteVisits) ? result.siteVisits : ((window._dataCache && window._dataCache.siteVisits) || []);
      staffCacheList = (Array.isArray(result.users) && result.users.length > 0) ? result.users : ((window._dataCache && window._dataCache.users) || []);
      vendorsCacheList = (Array.isArray(result.vendors) && result.vendors.length > 0) ? result.vendors : ((window._dataCache && window._dataCache.vendors) || []);
      associatesCacheList = (Array.isArray(result.associates) && result.associates.length > 0) ? result.associates : ((window._dataCache && window._dataCache.associates) || []);

      populateProjectFilter();
      populateAssigneeFilter();
      filterVisits();
      if (forceRefresh) showLoader(false);
    }

    // Check global cache first for instant render (0ms)
    if (!forceRefresh) {
      var cached = (window._dataCache && Array.isArray(window._dataCache.siteVisits))
        ? {
            siteVisits: window._dataCache.siteVisits,
            projects: window._dataCache.projects || [],
            leads: window._dataCache.leads || [],
            users: window._dataCache.users || [],
            customers: window._dataCache.customers || [],
            vendors: window._dataCache.vendors || [],
            associates: window._dataCache.associates || []
          }
        : cacheGet("siteVisitsViewData");
      if (cached) {
        applySiteVisitsData(cached);
        return;
      }
    }

    if (forceRefresh) showLoader(true, "Refreshing site visits...");

    if (google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success !== false) {
          cacheSet("siteVisitsViewData", result);
          applySiteVisitsData(result);
        } else {
          fetchLegacySiteVisitsData();
        }
      }).withFailureHandler(function(err) {
        fetchLegacySiteVisitsData();
      }).getSiteVisitsViewData();
    } else {
      fetchLegacySiteVisitsData();
    }
  };

  function fetchLegacySiteVisitsData() {
    var loadedCount = 0;
    var totalRequests = 7;
    function checkLoaded() {
      loadedCount++;
      if (loadedCount === totalRequests) {
        populateProjectFilter();
        renderVisits(allVisits);
        showLoader(false);
      }
    }
    google.script.run.withSuccessHandler(function(data) { customersCacheList = data || []; window.customersCacheList = data || []; checkLoaded(); }).withFailureHandler(function(err) { checkLoaded(); }).getCustomers();
    google.script.run.withSuccessHandler(function(data) {
      projectsCache = data || [];
      var select = document.getElementById("visit-project-id");
      if (select) {
        select.innerHTML = '<option value="">Select Project</option>' + projectsCache.filter(function(p) {
          return p.Status !== "Completed" && p.Status !== "Cancelled";
        }).map(function(p) {
          return '<option value="'.concat(p.ProjectID, '">').concat(escapeHtml(p.ProjectName), " (").concat(p.ProjectID, ")</option>");
        }).join("");
      }
      checkLoaded();
    }).withFailureHandler(function(err) { checkLoaded(); }).getProjects();
    google.script.run.withSuccessHandler(function(data) {
      leadsCacheList = data || [];
      window.leadsCacheList = data || [];
      var leadSelect = document.getElementById("visit-lead-id");
      if (leadSelect) {
        leadSelect.innerHTML = '<option value="">Select Lead</option>' + leadsCacheList.filter(function(l) {
          return l.LeadStatus !== "Lost";
        }).map(function(l) {
          var name = l.CustomerName || l.LeadName || l.LeadID;
          return '<option value="'.concat(l.LeadID, '">').concat(escapeHtml(name), " (").concat(l.LeadID, ")</option>");
        }).join("");
      }
      checkLoaded();
    }).withFailureHandler(function(err) { checkLoaded(); }).getLeads();
    google.script.run.withSuccessHandler(function(data) { allVisits = data || []; checkLoaded(); }).withFailureHandler(function(err) { checkLoaded(); }).getSiteVisits();
    google.script.run.withSuccessHandler(function(usersList) { staffCacheList = usersList || []; checkLoaded(); }).withFailureHandler(function(err) { checkLoaded(); }).getUsers();
    google.script.run.withSuccessHandler(function(data) { vendorsCacheList = data || []; checkLoaded(); }).withFailureHandler(function(err) { checkLoaded(); }).getVendors();
    google.script.run.withSuccessHandler(function(data) { associatesCacheList = data || []; checkLoaded(); }).withFailureHandler(function(err) { checkLoaded(); }).getAssociates();
  }

  function populateProjectFilter() {
    var filterSelect = document.getElementById("filter-visit-project");
    if (!filterSelect) return;
    var curVal = filterSelect.value;
    var html = '<option value="">All Projects & Leads</option>';

    var projs = (projectsCache && projectsCache.length > 0) ? projectsCache : ((window._dataCache && window._dataCache.projects) || window.projsCacheList || window.projectsCache || []);
    var leads = (leadsCacheList && leadsCacheList.length > 0) ? leadsCacheList : ((window._dataCache && window._dataCache.leads) || window.leadsCacheList || []);

    if (projs.length > 0) {
      html += '<optgroup label="Projects">';
      html += projs.map(function(p) {
        return '<option value="PROJ:'.concat(p.ProjectID, '">&#127970; ').concat(escapeHtml(p.ProjectName), ' (', p.ProjectID, ')</option>');
      }).join("");
      html += '</optgroup>';
    }
    if (leads.length > 0) {
      html += '<optgroup label="Leads / Prospects">';
      html += leads.map(function(l) {
        var name = l.CustomerName || l.LeadName || l.LeadID;
        return '<option value="LEAD:'.concat(l.LeadID, '">&#127919; ').concat(escapeHtml(name), " (").concat(l.LeadID, ')</option>');
      }).join("");
      html += '</optgroup>';
    }
    filterSelect.innerHTML = html;
    if (curVal) filterSelect.value = curVal;
    if (window.makeSearchableSelect) {
      window.makeSearchableSelect(filterSelect, { placeholder: "All Projects & Leads" });
    }
  }

  function populateAssigneeFilter() {
    var filterAssignee = document.getElementById("filter-visit-assignee");
    if (!filterAssignee) return;
    var curVal = filterAssignee.value;
    var html = '<option value="">All Assignees / Staff</option>';
    var users = (staffCacheList && staffCacheList.length > 0) ? staffCacheList : ((window._dataCache && window._dataCache.users) || window.usersCacheList || []);
    if (users.length > 0) {
      html += users.map(function(u) {
        var val = u.UserID || u.userId || u.FullName || "";
        var name = u.FullName || u.fullName || u.UserID || "Staff";
        var role = u.RoleID || u.roleId || "";
        return '<option value="' + escapeHtml(val) + '">' + escapeHtml(name) + (role ? ' (' + escapeHtml(role) + ')' : '') + '</option>';
      }).join("");
    }
    filterAssignee.innerHTML = html;
    if (curVal) filterAssignee.value = curVal;
    if (window.makeSearchableSelect) {
      window.makeSearchableSelect(filterAssignee, { placeholder: "All Assignees / Staff" });
    }
  }

  window.clearVisitFilters = function() {
    var searchInput = document.getElementById("visit-search");
    if (searchInput) searchInput.value = "";
    var projSelect = document.getElementById("filter-visit-project");
    if (projSelect) {
      projSelect.value = "";
      if (projSelect._refreshSearchable) projSelect._refreshSearchable();
    }
    var assigneeSelect = document.getElementById("filter-visit-assignee");

  function filterVisits() {
    var searchInput = document.getElementById("visit-search");
    var searchVal = searchInput ? (searchInput.value || "").toLowerCase().trim() : "";

    var projVal = projSelect ? (projSelect.value || "").trim() : "";

    var dateFrom = dateFromEl ? dateFromEl.value : "";
    var dateToEl = document.getElementById("filter-visit-date-to");
    var dateTo = dateToEl ? dateToEl.value : "";

    var totalLogs = 0;
    var totalScheduled = 0;

    var filtered = (allVisits || []).filter(function(v) {
      if (!v || typeof v !== "object") return false;
      var status = String(v.Status || "Completed").trim();
      var isSched = (status === "Scheduled");
      if (isSched) totalScheduled++;
      else totalLogs++;

      var matchesTab = (activeVisitTab === "scheduled") ? isSched : (!isSched);
      if (!matchesTab) return false;

      // Project / Lead filter
      if (projVal) {
        if (projVal.indexOf("PROJ:") === 0) {
          if (String(v.ProjectID || "") !== projVal.replace("PROJ:", "")) return false;
        } else if (projVal.indexOf("LEAD:") === 0) {
          if (String(v.LeadID || "") !== projVal.replace("LEAD:", "")) return false;
        } else {
          if (String(v.ProjectID || "") !== projVal && String(v.LeadID || "") !== projVal) return false;
        }
      }

      // Assignee filter
      if (assigneeVal) {
        var vAssignee = String(v.AssignedTo || "").toLowerCase();
        if (vAssignee !== assigneeVal && vAssignee.indexOf(assigneeVal) === -1) {
          var matchedStaff = (staffCacheList || []).find(function(s) {
            return (s.UserID && s.UserID.toLowerCase() === assigneeVal) || (s.FullName && s.FullName.toLowerCase() === assigneeVal);
          });
          if (!matchedStaff || (vAssignee !== (matchedStaff.UserID || "").toLowerCase() && vAssignee !== (matchedStaff.FullName || "").toLowerCase())) {
            return false;
          }
        }
      }

      // Billing filter
      if (billingVal) {
        var isBill = (v.IsBillable === "Yes" || v.IsBillable === true);
        if (billingVal === "Billable" && !isBill) return false;
        if (billingVal === "Non-Billable" && isBill) return false;
      }

      // Date range filter
      var vDate = (v.VisitDate || "").substring(0, 10);
      if (dateFrom && vDate && vDate < dateFrom) return false;
      if (dateTo && vDate && vDate > dateTo) return false;

      // Omni-search
      if (searchVal) {
        var vid = String(v.VisitID || "").toLowerCase();
        var purpose = String(v.Purpose || "").toLowerCase();
        var remarks = String(v.Remarks || "").toLowerCase();
        var assigned = String(v.AssignedTo || "").toLowerCase();
        var pid = String(v.ProjectID || "").toLowerCase();
        var lid = String(v.LeadID || "").toLowerCase();
        
        var projName = "";
        if (v.ProjectID) {
          var p = (projectsCache || []).find(function(pr) { return pr.ProjectID === v.ProjectID; });
          if (p) projName = (p.ProjectName || "").toLowerCase();
        }
        var leadName = "";
        if (v.LeadID) {
          var l = (leadsCacheList || []).find(function(ld) { return ld.LeadID === v.LeadID; });
          if (l) leadName = (l.CustomerName || l.LeadName || "").toLowerCase();
        }

        var matchesSearch = vid.indexOf(searchVal) !== -1 ||
                            purpose.indexOf(searchVal) !== -1 ||
                            remarks.indexOf(searchVal) !== -1 ||
                            assigned.indexOf(searchVal) !== -1 ||
                            pid.indexOf(searchVal) !== -1 ||
                            lid.indexOf(searchVal) !== -1 ||
                            projName.indexOf(searchVal) !== -1 ||
                            leadName.indexOf(searchVal) !== -1;
        if (!matchesSearch) return false;
      }

      return true;
    });

    // Update Live Badges
    var badgeLogs = document.getElementById("badge-count-logs");
    if (badgeLogs) badgeLogs.innerText = totalLogs;
    var badgeSched = document.getElementById("badge-count-scheduled");
    if (badgeSched) badgeSched.innerText = totalScheduled;

    // Filter indicator and Clear button
    var isFiltered = !!(searchVal || projVal || assigneeVal || billingVal || dateFrom || dateTo);
    var clearBtn = document.getElementById("btn-clear-visit-filters");
    if (clearBtn) clearBtn.style.display = isFiltered ? "inline-flex" : "none";

    var countIndicator = document.getElementById("visit-filtered-count");
    if (countIndicator) {
      var poolSize = (activeVisitTab === "scheduled") ? totalScheduled : totalLogs;
      if (isFiltered) {
        countIndicator.innerText = "Filtered: " + filtered.length + " of " + poolSize + " visits";
      } else {
        countIndicator.innerText = "Showing all (" + poolSize + ") visits";
      }
    }

    renderVisits(filtered);
  }

  function handleVisitSubmit(e) {

    var inputs = form.querySelectorAll("input, select, textarea");
    inputs.forEach(function(input) {
      if (input.name && input.type !== "file") {
        if (input.type === "checkbox") {
          formData[input.name] = input.checked ? input.value : "No";
        } else if (input.type === "radio") {
          if (input.checked) formData[input.name] = input.value;
        } else {
          formData[input.name] = input.value;
        }
      }
    });

    var isLeadRadio = document.getElementById("visit-link-lead") ? document.getElementById("visit-link-lead").checked : false;

      formData["LeadID"] = "";

        showToast("Please select a Project for this visit.", "error");
        return;
      }
    }

    var fileInput = document.getElementById("visit-attachment");
    var files = fileInput ? fileInput.files : [];
    var currentUser = JSON.parse(localStorage.getItem("pm_user") || "{}");
    var currentUserId = currentUser.userId || currentUser.UserID || currentUser.id || "";
    if (files.length > 0) {
      var fileDataArray = [];
      var loadedFiles = 0;
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var reader = new FileReader();
        reader.onload = function(f) {
          return function(evt) {
            var base64Data = evt.target.result.split(",")[1];
            fileDataArray.push({
              filename: f.name,
              mimeType: f.type,
              base64: base64Data
            });
            loadedFiles++;
            if (loadedFiles === files.length) {
              executeSaveVisit(formData, fileDataArray, currentUserId);
            }
          };
        }(file);
        reader.onerror = function() {
          showLoader(false);
          showToast("Failed to read one of the selected files.", "error");

        reader.readAsDataURL(file);
      }
    } else {
      executeSaveVisit(formData, null, currentUserId);

  }

    } else {
      var vIdx = allVisits.findIndex(function(v) { return v.VisitID === formData.VisitID; });
      if (vIdx !== -1) allVisits[vIdx] = Object.assign(allVisits[vIdx], formData);
      else allVisits.unshift(formData);
    }
    closeVisitModal();
    filterVisits();

    google.script.run.withSuccessHandler(function(response) {

        showToast(response.message || "Site visit saved successfully.", "success");
        loadSiteVisitsView(false);
      } else {
        showToast(response.message || "Failed to save visit.", "error");

    }).withFailureHandler(function(err) {

          showToast(response.message, "error");
        }
      }).withFailureHandler(function(err) {
        showToast(err.message, "error");
      }).deleteSiteVisit(visitId);
    }
  }

  function parseRawDateString(isoString) {
    if (!isoString)
      return "";
    return isoString.substring(0, 10);
  }

  function handleVisitAssignedTypeChange() {
    var typeEl = document.getElementById("visit-assigned-type");
    var type = typeEl ? typeEl.value : "Staff";
    var select = document.getElementById("visit-assigned-to");
    if (!select)
      return;
    if (type === "Staff") {
      select.innerHTML = '<option value="">Select Staff</option>' + (staffCacheList || []).filter(function(u) {
        return u && typeof u === "object";
      }).map(function(u) {
        var role = u.RoleID || u.roleId || u.Role || "";
        var roleStr = role ? " (" + escapeHtml(String(role)) + ")" : "";
        var val = u.UserID || u.userId || u.FullName || "";
        var name = u.FullName || u.UserID || "User";
        return '<option value="'.concat(escapeHtml(val), '">').concat(escapeHtml(name)).concat(roleStr, "</option>");
      }).join("");
    } else if (type === "Vendor") {
      select.innerHTML = '<option value="">Select Vendor</option>' + (vendorsCacheList || []).filter(function(v) {
        return v && typeof v === "object";
      }).map(function(v) {
        var vName = v.VendorName || v.VendorID || "";
        var vType = v.VendorType || "Vendor";
        return '<option value="'.concat(escapeHtml(vName), '">').concat(escapeHtml(vName), " (").concat(escapeHtml(vType), ")</option>");
      }).join("");
    } else if (type === "Associate") {
      select.innerHTML = '<option value="">Select Associate</option>' + (associatesCacheList || []).filter(function(a) {
        return a && typeof a === "object";
      }).map(function(a) {
        var aName = a.AssociateName || a.AssociateID || "";
        return '<option value="'.concat(escapeHtml(aName), '">').concat(escapeHtml(aName), "</option>");
      }).join("");
    } else {
      select.innerHTML = '<option value="">Select Assignee</option>';
    }
    if (window.makeSearchableSelect) {
      window.makeSearchableSelect(select, { placeholder: "Select " + type });
    }
  }

  function toggleVisitBillingField() {
    var isBillable = document.getElementById("visit-is-billable").checked;
    var billingGroup = document.getElementById("visit-billing-group");
    var billingInput = document.getElementById("visit-billing-amount");
    if (isBillable) {
      billingGroup.style.display = "block";
      billingInput.required = true;
    } else {
      billingGroup.style.display = "none";
      billingInput.required = false;
      billingInput.value = "";
    }
  }

  function removeAttachment(index) {
    var hiddenInput = document.getElementById("visit-photos-hidden");
    var photos = hiddenInput.value;
    if (!photos)
      return;
    var links = photos.split(",").map(function(l) {
      return l.trim();
    }).filter(function(l) {
      return l !== "";
    });
    links.splice(index, 1);
    var updatedPhotos = links.join(", ");
    hiddenInput.value = updatedPhotos;
    var currentAttachmentsContainer = document.getElementById("visit-current-attachments-container");
    var currentAttachmentsList = document.getElementById("visit-current-attachments-list");
    if (updatedPhotos === "") {
      if (currentAttachmentsContainer)
        currentAttachmentsContainer.style.display = "none";
      if (currentAttachmentsList)
        currentAttachmentsList.innerHTML = "";
    } else {
      if (currentAttachmentsList) {
        currentAttachmentsList.innerHTML = links.map(function(link, idx) {
          return '\n          <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.25rem 0.5rem; display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem;">\n            <a href="'.concat(escapeHtml(link), '" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 500;"><i class="fas fa-paperclip"></i> File ').concat(idx + 1, '</a>\n            <button type="button" onclick="removeAttachment(').concat(idx, ')" style="border: none; background: none; color: var(--danger); cursor: pointer; padding: 0; font-size: 0.75rem; line-height: 1;"><i class="fas fa-times"></i></button>\n          </div>\n        ');
        }).join("");
      }
    }
  }

  function toggleVisitAttachmentsDropdown(event, visitId) {
    event.stopPropagation();
    var dropdown = document.getElementById("dropdown-" + visitId);
    if (!dropdown)
      return;
    var isOpen = dropdown.style.display === "block";
    document.querySelectorAll(".attachments-dropdown-menu").forEach(function(el) {
      el.style.display = "none";
    });
    if (!isOpen) {
      dropdown.style.display = "block";
    }
  }

  document.addEventListener("click", function() {
    document.querySelectorAll(".attachments-dropdown-menu").forEach(function(el) {
      el.style.display = "none";
    });
  });

  window.switchVisitSubTab = switchVisitSubTab;
  window.openVisitModal = openVisitModal;
  window.closeVisitModal = closeVisitModal;
  window.editVisit = editVisit;
  window.deleteVisit = deleteVisit;
  window.handleVisitSubmit = handleVisitSubmit;
  window.filterVisits = filterVisits;
  window.handleVisitAssignedTypeChange = handleVisitAssignedTypeChange;
  window.toggleVisitBillingField = toggleVisitBillingField;
  window.removeAttachment = removeAttachment;
  window.toggleVisitAttachmentsDropdown = toggleVisitAttachmentsDropdown;
})();

</script>
