<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexMilestro - Project &amp; Milestone Management System | NexSolve</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%230f766e' d='M234.5 5.7c13.9-5 29.1-5 43.1 0l192 68.6C481.5 78.8 496 90.4 496 104v168c0 10.7-5.9 20.6-15.4 25.7l-96 51.4-1.1 .6-83.6 44.8v93.5c0 14.6-9.1 27.6-22.9 32.6l-192 68.6c-13.9 5-29.1 5-43.1 0l-192-68.6C30.5 513.2 16 500.2 16 485.6V317.6c0-10.7 5.9-20.6 15.4-25.7l96-51.4 1.1-.6 83.6-44.8V101.6c0-14.6 9.1-27.6 22.9-32.6l192-68.6z'/></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 10;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0f766e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .brand-title span { color: #2dd4bf; }
    .loading-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="brand-title"><i class="fas fa-cubes" style="color: #2dd4bf; margin-right: 8px;"></i>Nex<span>Milestro</span></div>
    <div class="loading-text">Connecting to Live Workspace...</div>
  </div>
  <iframe id="app-frame" allow="geolocation; camera; microphone; clipboard-read; clipboard-write;" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation allow-downloads"></iframe>
  <script>
    (function() {
      const BASE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyervSpXP1kNM__DFoVUOGsMZqhAQCzLav3xvNG3Zr-R6w63m_aH_OCJZpF9wAF5Lm4/exec";
      const currentQuery = window.location.search;
      const targetUrl = currentQuery ? (BASE_WEBAPP_URL + currentQuery) : BASE_WEBAPP_URL;
      const frame = document.getElementById("app-frame");
      const loader = document.getElementById("loading-screen");
      
      frame.src = targetUrl;
      frame.onload = function() {
        setTimeout(function() {
          loader.classList.add("hidden");
        }, 300);
      };
      
      setTimeout(function() {
        loader.classList.add("hidden");
      }, 3500);
    })();
  </script>
</body>
</html>
